[package]
name = "sdyxy-watchdog"
version = "0.1.0"
edition = "2021"

# Windows GUI 子系统: 运行时完全无控制台窗口(计划任务拉起也不闪窗)
[[bin]]
name = "sdyxy-watchdog"
path = "src/main.rs"

[dependencies]
# 异步定时循环
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
# 北京时间显示
chrono = "0.4"
# 存活检测改用 PID 文件 + OpenProcess(进程枚举在本机不可靠)

# SetThreadExecutionState/OpenProcess/CreateMutex(上课防休眠 + 单实例守卫)
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
